version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r web/requirements.txt -r web/requirements-dev.txt
  build:
    commands:
      - cd web
      - echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7 > VERSION
      - flake8 --exclude .venv .
      - FLASK_SECRET_KEY=test pytest tests --junitxml=../reports/junit.xml --cov=app --cov-report=xml:../reports/coverage.xml --cov-report=term

reports:
  web-tests:
    base-directory: reports
    files:
      - junit.xml
    file-format: JUNITXML
  web-coverage:
    base-directory: reports
    files:
      - coverage.xml
    file-format: COBERTURAXML

artifacts:
  base-directory: web
  files:
    - '**/*'
