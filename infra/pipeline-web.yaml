AWSTemplateFormatVersion: '2010-09-09'

Description: ShopLite web CI/CD pipeline (Source -> Build -> Approval -> Deploy)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  Owner:
    Type: String
    Description: Shoplite project owner

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar/CodeConnections connection to GitHub (shoplite-github)

  FullRepositoryId:
    Type: String
    Description: Full repository id of your fork, e.g. my-user/shoplite

  BranchName:
    Type: String
    Default: main

  ApprovalEmail:
    Type: String
    Description: E-mail address notified when a manual approval is pending

Resources:

  # SNS topic used by the manual approval action
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub shoplite-${Environment}-approvals
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  ApprovalSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: email
      Endpoint: !Ref ApprovalEmail

  # Role assumed by CodeBuild
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ShopLiteCodeBuildAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/shoplite-${Environment}-web-build*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/shoplite-${Environment}-web-integration*

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue:
                          Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

              # Publish the JUnit test report
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/shoplite-${Environment}-web-build-*
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # CodeBuild project: integration tests against the deployed ALB
  WebIntegrationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub shoplite-${Environment}-web-integration
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: web/buildspec-integration.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: BASE_URL
            Type: PLAINTEXT
            Value:
              Fn::Sub:
                - http://${AlbDns}
                - AlbDns:
                    Fn::ImportValue:
                      Fn::Sub: shoplite-${Environment}AlbDnsName
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # CodeBuild project: lint, unit tests, report, deployment bundle
  WebBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub shoplite-${Environment}-web-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: web/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # Role assumed by CodePipeline
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ShopLitePipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue:
                          Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

              # Use the GitHub connection (both prefixes: depends on the ARN of the connection)
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn

              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt WebBuildProject.Arn
                  - !GetAtt WebIntegrationProject.Arn

              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:shoplite-${Environment}-web
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:shoplite-${Environment}-web/shoplite-${Environment}-web-dg

              - Effect: Allow
                Action:
                  - codedeploy:GetDeploymentConfig
                Resource: !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ApprovalTopic
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  WebPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub shoplite-${Environment}-web-pipeline
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location:
          Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-ArtifactsBucketName

      # Only react to pushes on the branch that touch web/
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName
                FilePaths:
                  Includes:
                    - 'web/**'

      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: false
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref WebBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                NotificationArn: !Ref ApprovalTopic
                CustomData: Review the build and approve the deployment to the web servers

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              Configuration:
                ApplicationName: !Sub shoplite-${Environment}-web
                DeploymentGroupName: !Sub shoplite-${Environment}-web-dg
              InputArtifacts:
                - Name: BuildOutput

        - Name: IntegrationTest
          Actions:
            - Name: IntegrationTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref WebIntegrationProject
              InputArtifacts:
                - Name: SourceOutput
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

Outputs:

  PipelineName:
    Value: !Ref WebPipeline

  ApprovalTopicArn:
    Value: !Ref ApprovalTopic

  CodeBuildProjectName:
    Value: !Ref WebBuildProject

  IntegrationProjectName:
    Value: !Ref WebIntegrationProject
