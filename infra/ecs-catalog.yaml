AWSTemplateFormatVersion: '2010-09-09'

Description: ShopLite catalog service on ECS Fargate, blue/green with CodeDeploy

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  Owner:
    Type: String
    Description: Shoplite project owner

  ImageTag:
    Type: String
    Default: v2
    Description: Tag of the catalog image in ECR (used for the first deployment)

  ApiTokenSecretArn:
    Type: String
    Description: Full ARN of the secret shoplite/<env>/catalog/api-token

Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub shoplite-${Environment}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  LogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Logs chiffres par defaut par CloudWatch ; cle KMS hors perimetre du lab.
    Properties:
      LogGroupName: !Sub /shoplite/${Environment}/catalog
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP traffic to the catalog ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      SecurityGroupIngress:
        - Description: Production traffic (lab has no certificate)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Test traffic for the green task set
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub shoplite-${Environment}-catalog-alb-sg
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Port 8080 only from the catalog ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      SecurityGroupIngress:
        - Description: From the ALB only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub shoplite-${Environment}-catalog-task-sg
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub shoplite-${Environment}-catalog-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PublicSubnetA
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub shoplite-${Environment}-catalog-blue
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /products
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub shoplite-${Environment}-catalog-green
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /products
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  # Used by ECS to pull the image, write logs and read the injected values
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ShopLiteCatalogConfigRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shoplite/${Environment}/catalog/page-size
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ApiTokenSecretArn
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub shoplite-${Environment}-catalog
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: catalog
          Image:
            Fn::Sub:
              - '${RepositoryUri}:${ImageTag}'
              - RepositoryUri:
                  Fn::ImportValue:
                    Fn::Sub: shoplite-${Environment}-CatalogRepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Secrets:
            - Name: PAGE_SIZE
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shoplite/${Environment}/catalog/page-size
            - Name: API_TOKEN
              ValueFrom: !Ref ApiTokenSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: catalog
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ProdListener
      - TestListener
    Properties:
      ServiceName: !Sub shoplite-${Environment}-catalog
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      DeploymentController:
        Type: CODE_DEPLOY
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue:
                Fn::Sub: shoplite-${Environment}-PrivateSubnetA
            - Fn::ImportValue:
                Fn::Sub: shoplite-${Environment}-PrivateSubnetB
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: catalog
          ContainerPort: 8080
          TargetGroupArn: !Ref BlueTargetGroup
      PropagateTags: SERVICE
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub shoplite-${Environment}-catalog
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # 5xx answered by the catalog tasks (prod and test listeners)
  Catalog5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub shoplite-${Environment}-catalog-5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub shoplite-${Environment}-catalog-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt Service.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt BlueTargetGroup.TargetGroupName
              - Name: !GetAtt GreenTargetGroup.TargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref TestListener
      BlueGreenDeploymentConfiguration:
        # Pause before the traffic shift: stops if nobody continues within 60 minutes
        DeploymentReadyOption:
          ActionOnTimeout: STOP_DEPLOYMENT
          WaitTimeInMinutes: 60
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref Catalog5xxAlarm
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_REQUEST
          - DEPLOYMENT_STOP_ON_ALARM

Outputs:

  CatalogUrl:
    Value: !Sub http://${LoadBalancer.DNSName}

  ClusterName:
    Value: !Ref Cluster

  ServiceName:
    Value: !GetAtt Service.Name

  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Value: !Ref DeploymentGroup

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub shoplite-${Environment}-CatalogExecutionRoleArn

  ApiTokenSecretArn:
    Value: !Ref ApiTokenSecretArn
    Export:
      Name: !Sub shoplite-${Environment}-CatalogApiTokenSecretArn
