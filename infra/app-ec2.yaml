
AWSTemplateFormatVersion: '2010-09-09'

Description: ShopLite EC2 application infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  Owner:
    Type: String
    Description: Shoplite project owner

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # Security Group for the Application Load Balancer
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to the ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub shoplite-${Environment}-alb-sg
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # Security Group for EC2 instances
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only from the ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub shoplite-${Environment}-ec2-sg
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # IAM Role for EC2
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: ShopLiteArtifactReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  Fn::Sub:
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue:
                          Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: shoplite-${Environment}-ArtifactsBucketArn

        - PolicyName: ShopLiteSecretReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                # The trailing -* covers the 6 random characters Secrets Manager appends to the ARN
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:shoplite/${Environment}/web/flask-secret-key-*

        - PolicyName: ShopLiteReviewsParameterRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shoplite/${Environment}/reviews/*

      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # Service role assumed by CodeDeploy
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # Instance Profile
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # Launch Template
  ShopLiteLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub shoplite-${Environment}-lt

      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType

        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn

        SecurityGroupIds:
          - !Ref EC2SecurityGroup

        MetadataOptions:
          HttpTokens: required

        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -eux

              dnf update -y
              dnf install -y httpd ruby wget

              # Start Apache
              systemctl enable --now httpd

              cat > /var/www/html/index.html <<'EOF'
              <html>
                <body>
                  <h1>ShopLite Infrastructure - Lab 1</h1>
                  <p>EC2 instance successfully deployed!</p>
                </body>
              </html>
              EOF

              # Install CodeDeploy agent
              cd /home/ec2-user
              wget https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
              chmod +x ./install
              ./install auto
              systemctl enable codedeploy-agent
              systemctl start codedeploy-agent

              # Install CloudWatch Agent
              wget https://amazoncloudwatch-agent.s3.amazonaws.com/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm
              rpm -U ./amazon-cloudwatch-agent.rpm

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: shoplite
              - Key: Owner
                Value: !Ref Owner
              - Key: Name
                Value: !Sub shoplite-${Environment}-instance

          - ResourceType: volume
            Tags:
              - Key: Project
                Value: shoplite
              - Key: Owner
                Value: !Ref Owner

  # Target Group
  ShopLiteTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub shoplite-${Environment}-tg
      VpcId:
        Fn::ImportValue:
          Fn::Sub: shoplite-${Environment}-VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      # Shorten the default 300s drain so CodeDeploy's BlockTraffic step and instance removal finish faster
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # Application Load Balancer
  ShopLiteALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub shoplite-${Environment}-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4

      Subnets:
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PublicSubnetA
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PublicSubnetB

      SecurityGroups:
        - !Ref ALBSecurityGroup

      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # HTTP Listener
  ShopLiteListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ShopLiteALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ShopLiteTargetGroup

  # Auto Scaling Group
  ShopLiteASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub shoplite-${Environment}-asg

      MinSize: '2'
      MaxSize: '3'
      DesiredCapacity: '2'

      VPCZoneIdentifier:
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: shoplite-${Environment}-PrivateSubnetB

      LaunchTemplate:
        LaunchTemplateId: !Ref ShopLiteLaunchTemplate
        Version: !GetAtt ShopLiteLaunchTemplate.LatestVersionNumber

      TargetGroupARNs:
        - !Ref ShopLiteTargetGroup

      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

      Tags:
        - Key: Project
          Value: shoplite
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true

    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false

  # CodeDeploy application
  WebApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub shoplite-${Environment}-web
      ComputePlatform: Server
      Tags:
        - Key: Project
          Value: shoplite
        - Key: Owner
          Value: !Ref Owner

  # CodeDeploy deployment group (in-place, behind the ALB)
  WebDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref WebApplication
      DeploymentGroupName: !Sub shoplite-${Environment}-web-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      AutoScalingGroups:
        - !Ref ShopLiteASG
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
          - Name: !GetAtt ShopLiteTargetGroup.TargetGroupName
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

Outputs:

  CodeDeployApplicationName:
    Value: !Ref WebApplication

  CodeDeployDeploymentGroupName:
    Value: !Ref WebDeploymentGroup

  LoadBalancerDNS:
    Description: ShopLite application URL
    Value: !GetAtt ShopLiteALB.DNSName

  AlbDnsName:
    Description: ALB DNS name, used by the integration tests
    Value: !GetAtt ShopLiteALB.DNSName
    Export:
      Name: !Sub shoplite-${Environment}AlbDnsName

  AutoScalingGroupName:
    Value: !Ref ShopLiteASG

  LaunchTemplateId:
    Value: !Ref ShopLiteLaunchTemplate
